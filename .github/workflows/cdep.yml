# CDEP\ (회사 배포 환경 C-DEP 에서 돌리는 API 서버) 확인: CDEP\ 가 바뀐 채로 main 에 push 하거나 손으로 실행하면
# 시험(test_relay.py)을 돌리고, docker 가 있으면 컨테이너 이미지가 만들어지는지 확인합니다.
# C-DEP 배포(CD) 단계는 회사의 C-DEP 방식에 맞게 여기에 더하거나 C-DEP 쪽에서 CDEP 폴더를 빌드하게 합니다 (CDEP\README.md).
name: CDEP

on:
  push:
    branches: [main]
    paths: ['CDEP/**', '.github/workflows/cdep.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
        working-directory: CDEP
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          $python = if (Get-Command python -ErrorAction SilentlyContinue) { 'python' } else { 'py' }
          & $python -m unittest test_relay
          if ($LASTEXITCODE -ne 0) { throw "test_relay failed ($LASTEXITCODE)" }

      - name: Container image
        run: |
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) { Write-Host '::notice::docker 가 없어 이미지 확인을 건너뜁니다.'; exit 0 }
          docker build -t i-luncher-api:ci .
          if ($LASTEXITCODE -ne 0) { throw "docker build failed ($LASTEXITCODE)" }

# i-luncher 릴리스: GitHub(github.com 또는 GitHub Enterprise)의 self-hosted Windows 러너가 main 에 푸시될 때마다 확인·빌드하고,
# 다음 버전을 골라 GitHub Release 에 두 파일을 올립니다.
#   i-luncher-Setup.exe     처음 설치 (사용자별, 관리자 권한 없음, .NET 10 이 없는 PC 에는 실행 환경을 함께 설치)
#   i-luncher-win-x64.zip   설치된 런처가 시작할 때 확인해 스스로 업데이트하는 패키지
# 설치 파일은 하나입니다: 서버 목록 · 공지는 이 PC 의 Windows 계정이 빌드 설정 MASTER_USERS 에 있는 마스터만 봅니다.
#
# 앱 목록(catalog/apps.json)과 공지(공지.txt)는 런처가 GitHub API 로 바로 읽고 고치므로 릴리스를 만들지 않습니다 (paths-ignore).
# github.com 과 GitHub Enterprise 모두 그대로 동작합니다 (API 주소·저장소 이름은 러너 환경에서 읽음).
#
# 처음 한 번 (README "배포" 참고):
#   - 러너: Windows x64, .NET 10 SDK, 레이블 self-hosted + windows
#   - 비공개·internal 저장소면 Secret ILUNCHER_ENV 에 .env 내용 (.env.sample 참고: 최소 LAUNCHER_TOKEN=<읽기 전용 토큰>),
#     또는 러너 PC 에 .env 를 두고 러너 환경 변수 ILUNCHER_ENV_PATH 로 경로를 알려 줌. 공개 저장소면 필요 없음
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['catalog/**', '공지.txt', '**.md', '.env.sample', '.gitignore', 'AppKit/templates/**', 'Projects/**',
                   'CDEP/Dockerfile', 'CDEP/.dockerignore', 'CDEP/env.sample', 'CDEP/seed/**', 'CDEP/test_relay.py', 'CDEP/import_app_list.py', '.github/workflows/cdep.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.2.0 (empty: the next patch)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: i-luncher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, windows]
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 릴리스 노트: 지난 릴리스 태그 이후의 커밋 목록

      - name: Restore .env
        shell: powershell
        env:
          IL_ENV: ${{ secrets.ILUNCHER_ENV }}
        run: |
          if ($env:IL_ENV) { [IO.File]::WriteAllText("$PWD\.env", $env:IL_ENV, (New-Object Text.UTF8Encoding($false))); Write-Host '.env from secret ILUNCHER_ENV' }
          elseif ($env:ILUNCHER_ENV_PATH -and (Test-Path $env:ILUNCHER_ENV_PATH)) { Copy-Item $env:ILUNCHER_ENV_PATH .env -Force; Write-Host ".env from $env:ILUNCHER_ENV_PATH" }
          else { Write-Host "::notice::No .env: the launcher reads this repository's releases and app list without a built-in token (fine for a public repository)." }

      - name: Pick version
        id: version
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\Get-NextVersion.ps1 -Project Launcher\i-luncher.csproj

      - name: Check and build
        id: build
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\Publish-Release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Create release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PREVIOUS: ${{ steps.version.outputs.previous }}
          RELEASE_ASSETS: ${{ steps.build.outputs.zip }};${{ steps.build.outputs.setup }}
          RELEASE_TITLE: i-luncher
          RELEASE_FOOTER: '처음 설치: i-luncher-Setup.exe 를 실행하세요. 설치된 런처는 시작할 때 스스로 업데이트합니다.'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\New-GitHubRelease.ps1

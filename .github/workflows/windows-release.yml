name: Windows distribution

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '공지.txt'
      - 'Notices/**'
      - 'Tools/CI/Publish-Notices.py'
      - 'Tools/CI/Check-Notices.py'
      - '.github/workflows/publish-notices.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release (requires a version)
        required: false
        default: false
        type: boolean
      version:
        description: Release version, such as 0.1.0 or v0.1.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-distribution:
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER_LABELS_JSON || '["self-hosted","Windows","X64"]') }}
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_INPUT_VERSION: ${{ inputs.version }}
      RELEASE_INPUT_ENABLED: ${{ inputs.publish_release }}

    steps:
      - name: Fetch source into an isolated runner temp directory and build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = [string]$env:GITHUB_RUN_ID
          $runAttempt = [string]$env:GITHUB_RUN_ATTEMPT
          if ($runId -notmatch '^[0-9]+$' -or $runAttempt -notmatch '^[0-9]+$') {
            throw 'The Actions run identity is invalid.'
          }
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $checkout = [IO.Path]::GetFullPath((Join-Path $runnerTemp "i-luncher-source-$runId-$runAttempt"))
          if (-not $checkout.StartsWith($runnerTemp.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase)) {
            throw 'The checkout path escaped RUNNER_TEMP.'
          }
          if (Test-Path -LiteralPath $checkout) { throw "Refusing to reuse an existing checkout: $checkout" }

          $token = [string]$env:GITHUB_TOKEN
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'GITHUB_TOKEN is unavailable.' }
          $repositoryUri = $env:GITHUB_SERVER_URL.TrimEnd('/') + '/' + $env:GITHUB_REPOSITORY + '.git'
          $headerBytes = [Text.Encoding]::UTF8.GetBytes("x-access-token:$token")
          $authHeader = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String($headerBytes)
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraheader'
          $env:GIT_CONFIG_VALUE_0 = $authHeader

          try {
            New-Item -ItemType Directory -Path $checkout | Out-Null
            git -C $checkout init --quiet
            if ($LASTEXITCODE -ne 0) { throw 'git init failed.' }
            git -C $checkout remote add origin $repositoryUri
            if ($LASTEXITCODE -ne 0) { throw 'git remote configuration failed.' }
            git -C $checkout fetch --quiet --depth=1 origin $env:GITHUB_REF
            if ($LASTEXITCODE -ne 0) { throw 'GitHub source fetch failed.' }
            git -C $checkout checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'GitHub source checkout failed.' }
            $checkedOutSha = (& git -C $checkout rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $env:GITHUB_SHA) {
              throw 'The fetched source does not match GITHUB_SHA.'
            }
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
            $authHeader = $null
            $headerBytes = $null
            $token = $null

            $publishRelease = $false
            $version = ''
            $tagName = ''
            if ($env:GITHUB_REF -match '^refs/tags/(v[A-Za-z0-9][A-Za-z0-9._-]{0,63})$') {
              $tagName = $Matches[1]
              $version = $tagName.Substring(1)
              $publishRelease = $true
            }
            elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              if ($env:RELEASE_INPUT_ENABLED -eq 'true') {
                if ($env:GITHUB_REF -ne 'refs/heads/main' -and
                    $env:GITHUB_REF -notmatch '^refs/tags/v[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') {
                  throw 'Release dispatch must target main or a matching v* tag.'
                }
                if ([string]::IsNullOrWhiteSpace($env:RELEASE_INPUT_VERSION)) {
                  throw 'Enter a version when enabling release publication.'
                }
                $tagName = $env:RELEASE_INPUT_VERSION.Trim()
                if (-not $tagName.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
                  $tagName = 'v' + $tagName
                }
                if ($tagName -notmatch '^v[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') {
                  throw 'The requested release version has unsupported characters.'
                }
                $version = $tagName.Substring(1)
                $publishRelease = $true
              }
              elseif (-not [string]::IsNullOrWhiteSpace($env:RELEASE_INPUT_VERSION)) {
                $version = $env:RELEASE_INPUT_VERSION.Trim().TrimStart('v', 'V')
              }
            }
            if ([string]::IsNullOrWhiteSpace($version)) {
              $version = 'ci-' + $env:GITHUB_SHA.Substring(0, 12)
            }

            $releaseScript = Join-Path $checkout 'Tools\CI\Invoke-WindowsRelease.ps1'
            $releaseArgs = @{
              Repository = $env:GITHUB_REPOSITORY
              ServerUrl = $env:GITHUB_SERVER_URL
              ApiUrl = $env:GITHUB_API_URL
              Version = $version
            }
            if ($publishRelease) {
              $releaseArgs.TagName = $tagName
              $releaseArgs.PublishRelease = $true
            }
            & $releaseScript @releaseArgs
            if (-not $?) { throw 'The Windows distribution job failed.' }
          }
          finally {
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
            $authHeader = $null
            $headerBytes = $null
            $token = $null
            if (Test-Path -LiteralPath $checkout) {
              $item = Get-Item -Force -LiteralPath $checkout
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'Refusing to remove a reparse-point checkout.'
              }
              $expectedName = "i-luncher-source-$runId-$runAttempt"
              if (-not $item.FullName.Equals($checkout, [StringComparison]::OrdinalIgnoreCase) -or
                  -not $item.Name.Equals($expectedName, [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Refusing to remove a checkout not owned by this Actions run.'
              }
              $pending = New-Object 'Collections.Generic.Stack[string]'
              $pending.Push($checkout)
              while ($pending.Count -gt 0) {
                $directory = $pending.Pop()
                foreach ($child in (Get-Item -Force -LiteralPath $directory).GetFileSystemInfos()) {
                  if (($child.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                    if (($child.Attributes -band [IO.FileAttributes]::Directory) -ne 0) {
                      [IO.Directory]::Delete($child.FullName, $false)
                    }
                    else {
                      [IO.File]::Delete($child.FullName)
                    }
                    continue
                  }
                  if (($child.Attributes -band [IO.FileAttributes]::Directory) -ne 0) {
                    $pending.Push($child.FullName)
                  }
                }
              }
              Remove-Item -LiteralPath $checkout -Recurse -Force
            }
          }
